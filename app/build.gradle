plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alpay.chattabs'
    compileSdk 36

    defaultConfig {
        applicationId 'com.alpay.chattabs'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '3.0.0'
    }

    signingConfigs {
        debugStable {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugStable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debugStable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
